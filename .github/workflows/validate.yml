name: validate

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a breaking change in the Home Assistant manifest rules or in
    # HACS surfaces on its own instead of at the next release.
    - cron: "37 5 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          # Without this the runner takes the newest Python it can find, which
          # resolves a different Home Assistant dependency set from the one
          # people run, and changes on its own the day a new Python ships.
          python-version: "3.13"
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q --cov --cov-report=term-missing
      - run: uv run ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93  # master, 2026-09-13

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main, 2026-09-13
        with:
          category: integration
