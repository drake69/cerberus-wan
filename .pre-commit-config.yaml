# Install once with: uv tool install pre-commit && pre-commit install
#
# These are the checks that already run in CI, moved to where they cost a
# second instead of a round trip through a runner. Nothing here is stricter
# than the pipeline: a commit that passes locally passes there.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-ll, -ii]
        exclude: ^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        # uv.lock is a megabyte and belongs in the repository. Everything else
        # that size is a screenshot somebody forgot to resize.
        args: ['--maxkb=500']
        exclude: ^uv\.lock$

  - repo: local
    hooks:
      # Em dash, en dash, curly quotes, ellipsis and non breaking space are not
      # on the keyboard, they replace an ASCII character that already exists,
      # and they break grep, diff and sed for whoever comes after. The
      # repository is clean of them today; this is what keeps it that way.
      - id: no-typographic-characters
        name: no em dash, curly quotes, ellipsis or non breaking space
        language: system
        entry: python3 tools/no_typographic_characters.py
        types: [text]
        exclude: ^(uv\.lock|tools/no_typographic_characters\.py)$
