name: dependency-check

on:
  schedule:
    - cron: "0 9 1 * *"  # first of the month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Audit the locked dependencies
        id: audit
        continue-on-error: true
        run: |
          uv sync --all-extras --dev
          uv run --with pip-audit pip-audit --strict 2>&1 | tee audit-output.txt

      # An advisory that lands on the first of the month is worth an issue: it
      # arrives while nobody is looking at the repo, and a failed scheduled run
      # is easy to miss.
      - name: Open an issue when the audit finds something
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('audit-output.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependency audit found a known vulnerability',
              labels: ['dependencies'],
              body: `\`\`\`\n${audit}\n\`\`\``
            });
