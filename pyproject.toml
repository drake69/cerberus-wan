[project]
name = "cerberus-wan"
version = "0.4.0"
description = "Home Assistant sensor telling which provider is carrying the traffic"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["dnspython>=2.6.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13.236",
    # The serialiser the frontend uses to render a config flow. It arrives
    # with Home Assistant anyway, but the test that checks the dialog can be
    # rendered should not depend on it arriving.
    "voluptuous-serialize>=2.6",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Home Assistant test harness is a pytest plugin that loads for every test,
# including the ones that never touch it. Auto mode is what lets it manage the
# event loop it expects to find, so the domain tests keep running unchanged
# next to the ones that boot a real Home Assistant.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.coverage.run]
source = ["custom_components/cerberus_wan"]

[tool.coverage.report]
# 90% is the floor the blueprint asks for, and the suite sits comfortably above
# it. The gap that stays is infrastructure/dns.py: exercising the resolver for
# real would test dnspython, not this integration.
fail_under = 90
show_missing = true
