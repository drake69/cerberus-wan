<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Cerberus WAN. Three heads: the one in front watching you, the other two
    watching the lines you are not on. The shape is mdi:dog, the same glyph the
    provider sensor carries in Home Assistant, so the icon and the entity are
    recognisably the same animal.

    The head is drawn once and placed three times. The side heads are the same
    path squeezed horizontally and turned, which is what makes them read as the
    same face seen at an angle rather than as two different dogs.

    Colours for a dark background: the two are swapped in weight, so the front head stays the brightest thing in the mark.

    dog path: Material Design Icons by Pictogrammers, Apache-2.0.
    Regenerate the PNGs with brand/build_brand.sh, do not edit them by hand.
  -->
