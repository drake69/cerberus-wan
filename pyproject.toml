[project]
name = "cerberus-wan"
version = "0.1.0"
description = "Home Assistant sensor telling which provider is carrying the traffic"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["dnspython>=2.6.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
